name: Publish Canary to NPM

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from"
        required: true
        default: "main"
      canaryVersion:
        description: "Custom version (e.g., 1.2.3-canary.42)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Validate canary version format 🔍
        run: |
          VERSION="${{ github.event.inputs.canaryVersion }}"
          if [[ ! "$VERSION" =~ -canary- ]]; then
            echo "❌ Invalid version: '$VERSION'. It must include '-canary-'."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies and build 🔧
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Set version 📦
        run: npm version ${{ github.event.inputs.canaryVersion }} --no-git-tag-version

      - name: Rebuild after version change 🔁
        run: pnpm build

      - name: Publish canary on NPM 🚀
        run: pnpm run npm-publish:canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

